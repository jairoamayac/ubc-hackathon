[package]
name = "house_money"
version = "0.1.0"
edition = "2021"
description = "House Money: group savings pots with protected principal; only the yield can be played."

[lib]
crate-type = ["cdylib", "lib"]
name = "house_money"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
custom-heap = []
custom-panic = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "1.2.2"
anchor-spl = "1.2.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
